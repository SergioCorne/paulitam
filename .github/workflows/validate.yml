name: Validate storefront and GitOps
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check site/app.js && node --check site/catalog.js && node --check site/shop-core.js
      - run: for file in site/*.js server/*.cjs; do node --check "$file"; done
      - run: node --test tests/*.test.cjs
      - run: python3 scripts/version-assets.py --check
      - name: Render manifests
        run: kubectl kustomize . > /tmp/paulitam.yaml
      - name: Check Kubernetes object and ConfigMap limits
        run: |
          python3 - <<'PY'
          import pathlib
          objects = pathlib.Path('/tmp/paulitam.yaml').read_text().split('\n---\n')
          for obj in objects:
              if 'kind: ConfigMap\n' in obj:
                  assert len(obj.encode()) < 240_000, 'ConfigMap must fit apply and API limits'
          for name in ('index.html', 'app.js', 'styles.css', 'hero.webp', 'favicon.svg'):
              assert pathlib.Path('site', name).is_file(), name
          PY
