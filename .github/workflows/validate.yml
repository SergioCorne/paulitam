name: Validate storefront and GitOps
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/app.js
      - name: Render manifests
        run: kubectl kustomize . > /tmp/paulitam.yaml
      - name: Check Kubernetes object and ConfigMap limits
        run: |
          python3 - <<'PY'
          import pathlib
          size = sum(p.stat().st_size for p in pathlib.Path('site').iterdir())
          assert size < 500_000, 'Site must fit safely in a Kubernetes ConfigMap'
          for name in ('index.html', 'app.js', 'styles.css', 'hero.webp', 'favicon.svg'):
              assert pathlib.Path('site', name).is_file(), name
          PY
