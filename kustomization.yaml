apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paulitam
resources:
  - deploy/namespace.yaml
  - deploy/deployment.yaml
  - deploy/service.yaml
  - deploy/ingress.yaml
  - deploy/experiences-api.yaml
configMapGenerator:
  - name: paulitam-site
    files:
      - site/index.html
      - site/styles.css
      - site/app.js
      - site/atelier-catalog.js
      - site/atelier-core.js
      - site/atelier-visuals.js
      - site/atelier-ui.js
      - site/atelier-designer.js
      - site/atelier.css
      - site/catalog.js
      - site/shop-core.js
      - site/universe.css
      - site/heart-cursor.svg
      - site/favicon.svg
      - site/hero.webp
      - site/robots.txt
  - name: paulitam-nginx
    files:
      - deploy/default.conf
  - name: paulitam-image-bloom
    files:
      - site/bloom.webp
  - name: paulitam-image-sunny
    files:
      - site/sunny.webp
  - name: paulitam-image-cozy
    files:
      - site/cozy.webp
  - name: paulitam-image-snow
    files:
      - site/snow.webp
