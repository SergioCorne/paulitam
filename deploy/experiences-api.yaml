apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paulitam-experiences-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paulitam-api
spec:
  selector:
    app.kubernetes.io/name: paulitam-api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paulitam-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: paulitam-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paulitam-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: node:24-alpine
          command: [node, /app/app.cjs]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: PUBLIC_ORIGIN
              value: https://paulitam.woas-team.team
            - name: DATABASE_PATH
              value: /data/paulitam.sqlite
            - name: REVIEW_ONLY
              value: "false"
          envFrom:
            - secretRef:
                name: paulitam-experiences-runtime
                optional: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          configMap:
            name: paulitam-api-source
        - name: data
          persistentVolumeClaim:
            claimName: paulitam-experiences-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
