server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;
    add_header Cache-Control "no-cache" always;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    # Archived concept references stay in Git history; unverified character artwork is not marketed.
    location = /belle.webp { return 404; }
    location = /simba.webp { return 404; }
    location = /snoopy.webp { return 404; }
    location = /pirate.webp { return 404; }
    location /api/ {
        proxy_pass http://paulitam-api:3000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        access_log off;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
