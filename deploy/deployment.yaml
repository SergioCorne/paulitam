apiVersion: apps/v1
kind: Deployment
metadata:
  name: paulitam
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: paulitam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paulitam
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.28.0-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: site
          projected:
            sources:
              - configMap:
                  name: paulitam-site
              - configMap:
                  name: paulitam-image-bloom
              - configMap:
                  name: paulitam-image-sunny
              - configMap:
                  name: paulitam-image-cozy
              - configMap:
                  name: paulitam-image-snow
              - configMap:
                  name: paulitam-image-belle
              - configMap:
                  name: paulitam-image-simba
              - configMap:
                  name: paulitam-image-pirate
              - configMap:
                  name: paulitam-image-snoopy
              - configMap:
                  name: paulitam-image-bff-sun
              - configMap:
                  name: paulitam-image-bff-moon
              - configMap:
                  name: paulitam-image-christmas
              - configMap:
                  name: paulitam-image-valentine
              - configMap:
                  name: paulitam-image-halloween
              - configMap:
                  name: paulitam-image-school
              - configMap:
                  name: paulitam-image-foodie
              - configMap:
                  name: paulitam-image-cosmic
              - configMap:
                  name: paulitam-image-pets
              - configMap:
                  name: paulitam-image-music
              - configMap:
                  name: paulitam-image-sports
        - name: config
          configMap:
            name: paulitam-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
