apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paulitam
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: paulitam.woas-team.team
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paulitam
                port:
                  name: http
